<!doctype html>
<html lang="en">
  <head>
    <title>DogPage</title>
    <link href="css/dogFacts.css" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://cdn-icons-png.flaticon.com/512/1998/1998627.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav>
      <a href="index.html">back to main page</a>
      <a href="chooseADog.html">Choose A dog </a>
    </nav>

    <header>
      <h1>Show me the Dog Facts</h1>
    </header>

    <div class="dropdown"></div>

    <div class="factSection">
      <div class="buttons">
        <button type="button" id="descBtn" class="button">description</button>
        <button type="button" id="histBtn" class="button">history</button>
        <button type="button" id="lifeBtn" class="button">Life Span</button>
        <button type="button" id="origBtn" class="button">origin</button>
        <button type="button" id="tempBtn" class="button">temperament</button>
      </div>
      <div class="fact">
        <h2>Choose a Fact</h2>
        <ol>
          <li id="description"></li>
          <li id="history"></li>
          <li id="life_span"></li>
          <li id="origin"></li>
          <li id="temperament"></li>
        </ol>
      </div>
    </div>

    <script src="js/dogFacts.js"></script>
  </body>
</html>
